<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 150" role="img" aria-label="An empty bathroom shelf with three pastel bottles and a plus sign hinting where a new product could go">
  <title>Empty shelf</title>
  <!-- ambient glow beneath the bottles -->
  <ellipse cx="140" cy="120" rx="110" ry="14" fill="#2f7a52" opacity="0.1"/>
  <!-- shelf plank -->
  <rect x="22" y="136" width="236" height="5" rx="2.5" fill="#2f7a52" opacity="0.24"/>

  <!-- left bottle (slim) -->
  <g>
    <rect x="70" y="84" width="28" height="52" rx="6" fill="#2f7a52" opacity="0.62"/>
    <rect x="78" y="73" width="12" height="12" rx="2" fill="#2f7a52" opacity="0.78"/>
    <rect x="74" y="94" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- center hero bottle (tallest) -->
  <g>
    <rect x="120" y="48" width="34" height="88" rx="7" fill="#1f5f3d" opacity="0.95"/>
    <rect x="130" y="36" width="14" height="14" rx="2.5" fill="#1f5f3d" opacity="0.82"/>
    <rect x="125" y="64" width="24" height="4" rx="1.5" fill="#ffffff" opacity="0.62"/>
    <rect x="125" y="75" width="14" height="2" rx="1" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- right jar (short) -->
  <g>
    <rect x="172" y="95" width="38" height="41" rx="6" fill="#b4633b" opacity="0.6"/>
    <rect x="178" y="87" width="26" height="9" rx="2" fill="#b4633b" opacity="0.76"/>
    <rect x="176" y="106" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- floating plus hint above the hero bottle -->
  <g transform="translate(137 22)">
    <circle r="12" fill="#ffffff"/>
    <circle r="12" fill="none" stroke="#1f5f3d" stroke-width="1.6" opacity="0.7"/>
    <path d="M-5 0h10M0 -5v10" stroke="#1f5f3d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#1f5f3d">
    <circle cx="52" cy="50" r="2.4" opacity="0.55"/>
    <circle cx="240" cy="40" r="1.8" opacity="0.5"/>
    <circle cx="38" cy="110" r="1.5" opacity="0.4"/>
    <circle cx="252" cy="110" r="2" opacity="0.4"/>
    <circle cx="220" cy="62" r="1.4" opacity="0.35"/>
    <circle cx="60" cy="72" r="1.2" opacity="0.3"/>
  </g>
</svg>
